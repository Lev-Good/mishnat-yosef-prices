name: Daily Price Update

on:
  schedule:
    # רץ בכל בוקר בשעה 04:00 UTC (06:00/07:00 שעון ישראל)
    - cron: '0 4 * * *'
  workflow_dispatch: # מאפשר הפעלה ידנית בלחיצת כפתור

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Price Update Automation
        run: |
          python update_prices.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily price benchmark update [skip ci]" && git push)
