name: Daily Price Update

on:
  schedule:
    # סריקה רציפה 4 פעמים ביממה כדי לתפוס פתיחת מכירות בכל תחנה ועיר בארץ (שלישי/רביעי/חמישי)
    # 1. בוקר: 05:00 UTC (07:00 / 08:00 שעון ישראל) - רענון מחירי שוק
    - cron: '0 5 * * *'
    # 2. צהריים: 11:00 UTC (13:00 / 14:00 שעון ישראל)
    - cron: '0 11 * * *'
    # 3. ערב: 18:30 UTC (20:30 / 21:30 שעון ישראל) - שעת פתיחה מרכזית בימי חמישי
    - cron: '30 18 * * *'
    # 4. לילה: 22:30 UTC (00:30 / 01:30 שעון ישראל) - סגירת יום ובדיקת מכירות לילה
    - cron: '30 22 * * *'
  workflow_dispatch: # מאפשר הפעלה ידנית בלחיצת כפתור בכל עת

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Price Update Automation
        env:
          MISHNAT_EMAIL: ${{ secrets.MISHNAT_EMAIL }}
          MISHNAT_PASSWORD: ${{ secrets.MISHNAT_PASSWORD }}
        run: |
          python update_prices.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Daily price benchmark update [skip ci]" && git push)
